<div id="installHelp" class="modal"><div class="sheet"><h2>📲 Instalar BECO’S en el celular</h2><p>Esta versión está preparada para publicarse como una aplicación web. En Chrome, abrí el menú <b>⋮</b> y elegí <b>“Agregar a pantalla principal”</b> o <b>“Instalar aplicación”</b> si aparece.</p><div class="actions"><button class="secondary" onclick="document.getElementById('installHelp').classList.remove('on')">Cerrar</button></div></div></div>
<script>
function installHelp(){document.getElementById('installHelp').classList.add('on')}
const K='becos_v8';
let D=JSON.parse(localStorage.getItem(K)||'{}');
D.clientes=Array.isArray(D.clientes)?D.clientes:[];
D.vehiculos=Array.isArray(D.vehiculos)?D.vehiculos:[];
D.servicios=Array.isArray(D.servicios)?D.servicios:[];
D.productos=Array.isArray(D.productos)?D.productos:[];
D.settings=(D.settings&&typeof D.settings==='object')?D.settings:{};
const mainEl=document.getElementById('main'), modalEl=document.getElementById('modal'), sheetEl=document.getElementById('sheet');
const save=()=>localStorage.setItem(K,JSON.stringify(D));
const newid=()=>Date.now()+Math.random();
const E=x=>String(x??'').replace(/[&<>"]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[a]));
let syncing=false;

function cleanUrl(u){
  return String(u||'').trim().replace(/\/+$/,'');
}
function cfg(){
  return !!(cleanUrl(D.settings?.url) && String(D.settings?.key||'').trim());
}
function supabaseBase(){
  return cleanUrl(D.settings?.url);
}
function apiHeaders(withBody=false){
  const h={
    'apikey':String(D.settings.key||'').trim(),
    'Accept':'application/json'
  };
  // IMPORTANT: with the new sb_publishable_* keys, do not send the
  // publishable key as Bearer. Bearer is only the user's JWT.
  if(D.settings.access_token) h.Authorization='Bearer '+D.settings.access_token;
  if(withBody) h['Content-Type']='application/json';
  return h;
}
function explainNetworkError(e){
  if(e && e.name==='TypeError'){
    return 'El navegador no pudo comunicarse con Supabase. Verificá la Project URL, la conexión a Internet y que la URL empiece con https://. Si la URL y la red están bien, usá "Diagnóstico" para ver qué parte falla.';
  }
  return e?.message || String(e);
}
async function rawFetch(path,opts={},retry=true){
  if(!cfg()) throw new Error('Falta configurar Project URL y Publishable key.');
  const url=supabaseBase()+path;
  const body=opts.body;
  let r;
  try{
    r=await fetch(url,{
      method:opts.method||'GET',
      headers:{...apiHeaders(!!body),...(opts.headers||{})},
      body,
      mode:'cors',
      credentials:'omit',
      cache:'no-store'
    });
  }catch(e){
    const x=new Error(explainNetworkError(e));
    x.code='NETWORK';
    x.cause=e;
    throw x;
  }
  const text=await r.text();
  let data=[];
  try{data=text?JSON.parse(text):[];}catch{data=text;}
  if(!r.ok){
    // Access tokens expire. Refresh once and retry the original request.
    if(r.status===401 && retry && D.settings.refresh_token){
      const ok=await refresh();
      if(ok) return rawFetch(path,opts,false);
    }
    let detail='';
    if(data && typeof data==='object'){
      detail=data.message||data.error_description||data.error||data.msg||JSON.stringify(data);
    }else detail=String(data||'');
    const err=new Error(`Supabase respondió HTTP ${r.status}${detail?': '+detail:''}`);
    err.status=r.status;
    err.data=data;
    throw err;
  }
  return data;
}
async function api(path,opts={}){return rawFetch(path,opts)}

async function login(email,password){
  if(!cfg()) throw new Error('Primero ingresá Project URL y Publishable key.');
  if(!email||!password) throw new Error('Ingresá correo y contraseña de Supabase.');
  let r;
  try{
    r=await fetch(supabaseBase()+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{
        'apikey':String(D.settings.key||'').trim(),
        'Content-Type':'application/json',
        'Accept':'application/json'
      },
      body:JSON.stringify({email,password}),
      mode:'cors',
      credentials:'omit',
      cache:'no-store'
    });
  }catch(e){
    const x=new Error(explainNetworkError(e)); x.code='NETWORK'; throw x;
  }
  const text=await r.text();
  let x={};
  try{x=text?JSON.parse(text):{};}catch{}
  if(!r.ok){
    const msg=x.error_description||x.msg||x.message||x.error||`HTTP ${r.status}`;
    const err=new Error(`Supabase Auth HTTP ${r.status}: ${msg}`);
    err.status=r.status; throw err;
  }
  if(!x.access_token) throw new Error('Supabase no devolvió un access token. Verificá el usuario y la contraseña.');
  D.settings.access_token=x.access_token;
  D.settings.refresh_token=x.refresh_token||'';
  D.settings.email=email;
  save();
  return x;
}

async function refresh(){
  if(!cfg()||!D.settings.refresh_token)return false;
  try{
    const r=await fetch(supabaseBase()+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{
        'apikey':String(D.settings.key||'').trim(),
        'Content-Type':'application/json',
        'Accept':'application/json'
      },
      body:JSON.stringify({refresh_token:D.settings.refresh_token}),
      mode:'cors',
      credentials:'omit',
      cache:'no-store'
    });
    if(!r.ok)return false;
    const x=await r.json();
    if(!x.access_token)return false;
    D.settings.access_token=x.access_token;
    D.settings.refresh_token=x.refresh_token||D.settings.refresh_token;
    save();
    return true;
  }catch{return false}
}

async function testConnection(silent=false){
  try{
    await api('/rest/v1/clientes?select=id&limit=1');
    if(!silent) alert('✅ Supabase responde correctamente y la tabla "clientes" es accesible con este usuario.');
    return {ok:true,message:'Supabase y clientes OK'};
  }catch(e){
    if(!silent) alert('❌ '+(e.status?`HTTP ${e.status}: `:'')+e.message);
    return {ok:false,error:e};
  }
}

async function diagnose(){
  if(!cfg()) return alert('❌ Primero ingresá Project URL y Publishable key.');
  const out=[];
  out.push('URL: '+supabaseBase());
  out.push('Clave: '+(String(D.settings.key||'').startsWith('sb_publishable_')?'Publishable key detectada':'Revisar: no parece una sb_publishable_...'));
  try{
    const r=await fetch(supabaseBase()+'/auth/v1/settings',{
      headers:{'apikey':String(D.settings.key||'').trim(),'Accept':'application/json'},
      mode:'cors',credentials:'omit',cache:'no-store'
    });
    out.push(`Auth API: HTTP ${r.status}`);
    if(!r.ok){
      const t=await r.text();
      out.push(t.slice(0,300));
    }
  }catch(e){out.push('Auth API: ERROR DE RED — '+explainNetworkError(e));}

  for(const table of ['clientes','vehiculos','servicios','productos']){
    try{
      const data=await api('/rest/v1/'+table+'?select=*&limit=1');
      out.push(`Tabla ${table}: ✅ accesible (${Array.isArray(data)?data.length:1} registro de prueba)`);
    }catch(e){
      out.push(`Tabla ${table}: ❌ ${e.status?'HTTP '+e.status+': ':''}${e.message}`);
    }
  }
  alert("🔎 DIAGNÓSTICO BECO'S\n\n"+out.join("\n"));
}

function naturalKey(table,x){
  if(table==='clientes'){
    const doc=String(x.doc||'').trim().toLowerCase();
    const tel=String(x.telefono||'').replace(/\D/g,'');
    const nom=String(x.nombre||'').trim().toLowerCase();
    return doc?`doc:${doc}`:(tel?`tel:${tel}`:`nom:${nom}`);
  }
  if(table==='vehiculos') return `pat:${String(x.patente||'').trim().toUpperCase()}`;
  if(table==='productos') return `prod:${String(x.nombre||'').trim().toLowerCase()}`;
  if(table==='servicios'){
    return `svc:${String(x.fecha||'')}|${String(x.patente||'').trim().toUpperCase()}|${Number(x.km)||0}|${String(x.trabajo||'').trim().toLowerCase()}|${Number(x.importe)||0}`;
  }
  return String(x.id||'');
}

function localToRow(table,x){
  if(table==='clientes') return {nombre:x.nombre||'',telefono:x.telefono||'',doc:x.doc||'',direccion:x.direccion||''};
  if(table==='vehiculos') return {cliente_id:x.cliente||null,patente:x.patente||'',marca:x.marca||'',modelo:x.modelo||'',anio:Number(x.anio)||null,km_actuales:Number(x.km)||0,proximo_service_km:Number(x.next)||null,combustible:x.combustible||'Nafta',observaciones:x.observaciones||null};
  if(table==='servicios') return {vehiculo_id:x.vehiculo_id||null,fecha:x.fecha||'',km_entrada:Number(x.km)||0,patente:x.patente||'',aceite:x.aceite||null,filtros_repuestos:x.partes||null,trabajos_realizados:x.trabajo||null,proximo_service_km:Number(x.next)||null,importe:Number(x.importe)||0};
  if(table==='productos') return {nombre:x.nombre||'',categoria:x.categoria||'',stock:Number(x.stock)||0,precio_venta:Number(x.precio)||0};
}

function rowToLocal(table,x){
  if(table==='clientes') return {id:x.id,nombre:x.nombre||'',telefono:x.telefono||'',doc:x.doc||x.dni||x.cuit||'',direccion:x.direccion||''};
  if(table==='vehiculos') return {id:x.id,cliente:x.cliente_id||x.cliente||'',patente:x.patente||'',marca:x.marca||'',modelo:x.modelo||'',anio:x.anio||x.año||'',km:+(x.km_actuales||x.km||0),next:+(x.proximo_service_km||x.next||0),combustible:x.combustible||'Nafta',observaciones:x.observaciones||''};
  if(table==='servicios') return {id:x.id,vehiculo_id:x.vehiculo_id||'',fecha:x.fecha||'',patente:x.patente||'',km:+(x.km_entrada||x.km||0),aceite:x.aceite||'',partes:x.filtros_repuestos||x.partes||'',trabajo:x.trabajos_realizados||x.trabajo||'',next:+(x.proximo_service_km||x.next||0),importe:+(x.importe||0)};
  if(table==='productos') return {id:x.id,nombre:x.nombre||'',categoria:x.categoria||'',stock:+(x.stock??0),precio:+(x.precio_venta??x.precio??0)};
}

async function backupLocal(reason='manual'){
  const payload={version:'BECO-S-BACKUP-1',createdAt:new Date().toISOString(),reason,data:{
    clientes:D.clientes,vehiculos:D.vehiculos,servicios:D.servicios,productos:D.productos
  }};
  localStorage.setItem(K+'_backup',JSON.stringify(payload));
  D.settings.lastBackup=payload.createdAt;
  save();
  return payload;
}

function downloadBackup(){
  const payload=JSON.parse(localStorage.getItem(K+'_backup')||'null')||{version:'BECO-S-BACKUP-1',createdAt:new Date().toISOString(),data:{
    clientes:D.clientes,vehiculos:D.vehiculos,servicios:D.servicios,productos:D.productos
  }};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='BECO_S_respaldo_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

async function fetchRemote(){
  const [c,v,s,p]=await Promise.all([
    api('/rest/v1/clientes?select=*'),
    api('/rest/v1/vehiculos?select=*'),
    api('/rest/v1/servicios?select=*'),
    api('/rest/v1/productos?select=*')
  ]);
  return {clientes:c.map(x=>rowToLocal('clientes',x)),vehiculos:v.map(x=>rowToLocal('vehiculos',x)),servicios:s.map(x=>rowToLocal('servicios',x)),productos:p.map(x=>rowToLocal('productos',x))};
}

async function pushLocalTable(table, localArr, remoteArr){
  const remoteByKey=new Map(remoteArr.map(x=>[naturalKey(table,x),x]));
  const result=[];
  for(const item of localArr){
    const key=naturalKey(table,item);
    const remote=remoteByKey.get(key);
    if(remote){
      item.id=remote.id;
      try{
        await api('/rest/v1/'+table+'?id=eq.'+encodeURIComponent(remote.id),{
          method:'PATCH',body:JSON.stringify(localToRow(table,item))
        });
      }catch(e){ console.warn('PATCH '+table,e); }
      result.push(item);
    }else{
      const created=await insert(table,localToRow(table,item));
      if(created?.id) item.id=created.id;
      result.push(item);
    }
  }
  return result;
}

function mergeRemote(localArr,remoteArr,table){
  const map=new Map(localArr.map(x=>[naturalKey(table,x),x]));
  for(const r of remoteArr){
    const key=naturalKey(table,r);
    if(!map.has(key)) localArr.push(r);
  }
  return localArr;
}

function remapForeignKeys(oldClients,oldVehicles){
  // After syncing parents, their IDs can change from local temporary IDs to
  // Supabase IDs. Update every dependent record before sending it remotely.
  const clientMap=new Map();
  for(const before of oldClients){
    const now=D.clientes.find(x=>naturalKey('clientes',x)===naturalKey('clientes',before));
    if(now) clientMap.set(String(before.id),now.id);
  }
  D.vehiculos.forEach(v=>{
    const mapped=clientMap.get(String(v.cliente));
    if(mapped!=null) v.cliente=mapped;
  });

  const vehicleMap=new Map();
  for(const before of oldVehicles){
    const now=D.vehiculos.find(x=>naturalKey('vehiculos',x)===naturalKey('vehiculos',before));
    if(now) vehicleMap.set(String(before.id),now.id);
  }
  D.servicios.forEach(s=>{
    const mapped=vehicleMap.get(String(s.vehiculo_id));
    if(mapped!=null) s.vehiculo_id=mapped;
    const v=D.vehiculos.find(x=>String(x.id)===String(s.vehiculo_id));
    if(v) s.patente=v.patente;
  });
}

async function previewSupabase(){
  if(!cfg())return alert('Primero configurá Supabase.');
  try{
    const r=await fetchRemote();
    const msg=`Supabase tiene:\n\n${r.clientes.length} clientes\n${r.vehiculos.length} vehículos\n${r.servicios.length} servicios\n${r.productos.length} productos\n\nActualmente BECO'S tiene:\n${D.clientes.length} clientes\n${D.vehiculos.length} vehículos\n${D.servicios.length} servicios\n${D.productos.length} productos`;
    if(!confirm('🔎 PREVISUALIZACIÓN\n\n'+msg+'\n\n¿Querés recuperar estos datos en BECO\'S?\n\nPrimero se crea un respaldo local. Los datos de Supabase se agregan a la aplicación y no se borra nada de Supabase.'))return;
    await recoverRemoteOnly(r);
  }catch(e){alert('❌ No se pudo consultar Supabase: '+(e.status?`HTTP ${e.status}: `:'')+e.message)}
}

async function recoverRemoteOnly(r){
  syncing=true; updateSyncStatus('Recuperando desde Supabase...', 'busy');
  try{
    await backupLocal('antes-de-recuperar-supabase');
    D.clientes=mergeRemote(D.clientes,r.clientes,'clientes');
    D.vehiculos=mergeRemote(D.vehiculos,r.vehiculos,'vehiculos');
    D.servicios=mergeRemote(D.servicios,r.servicios,'servicios');
    D.productos=mergeRemote(D.productos,r.productos,'productos');
    save(); updateSyncStatus('Recuperación OK','ok');
    home();
    alert(`✅ Recuperación terminada.\n\nClientes: ${D.clientes.length}\nVehículos: ${D.vehiculos.length}\nServicios: ${D.servicios.length}\nProductos: ${D.productos.length}\n\nNo se modificó ni borró ningún dato de Supabase.`);
  }catch(e){
    save(); updateSyncStatus('Error de recuperación','err');
    alert('❌ No se pudo recuperar los datos.\n\n'+(e.status?`HTTP ${e.status}: `:'')+e.message+'\n\nTus datos locales permanecen guardados.');
  }finally{syncing=false}
}

async function safeSynchronize(){
  if(!cfg()) throw new Error('Primero configurá Supabase.');
  if(syncing)return;
  syncing=true; updateSyncStatus('Respaldando y sincronizando...', 'busy');
  try{
    await backupLocal('antes-de-sincronizar');
    const remote=await fetchRemote();
    const beforeClients=D.clientes.map(x=>({...x}));
    const beforeVehicles=D.vehiculos.map(x=>({...x}));

    // Never delete remote-only records. Merge them into the local copy first.
    D.clientes=mergeRemote(D.clientes,remote.clientes,'clientes');
    D.vehiculos=mergeRemote(D.vehiculos,remote.vehiculos,'vehiculos');
    D.servicios=mergeRemote(D.servicios,remote.servicios,'servicios');
    D.productos=mergeRemote(D.productos,remote.productos,'productos');

    // Parents first. Client IDs are reconciled before vehicles are sent,
    // then vehicle IDs are reconciled before services are sent.
    D.clientes=await pushLocalTable('clientes',D.clientes,remote.clientes);
    remapForeignKeys(beforeClients,beforeVehicles);
    D.vehiculos=await pushLocalTable('vehiculos',D.vehiculos,remote.vehiculos);
    remapForeignKeys(beforeClients,beforeVehicles);
    D.servicios=await pushLocalTable('servicios',D.servicios,remote.servicios);
    D.productos=await pushLocalTable('productos',D.productos,remote.productos);

    save(); updateSyncStatus('Sincronización segura OK','ok');
    home();
    alert('✅ Sincronización terminada.\n\nSe creó un respaldo antes de sincronizar.\nNo se borraron registros remotos y se corrigieron las relaciones entre clientes, vehículos y servicios.');
  }catch(e){
    save(); updateSyncStatus('Error de sincronización','err');
    alert('❌ No se pudo completar la sincronización.\n\n'+(e.status?`HTTP ${e.status}: `:'')+e.message+'\n\nTus datos locales permanecen guardados y el último respaldo está disponible.');
  }finally{syncing=false}
}

function findOlderCopies(){
  const candidates=[];
  const keys=['becos_v3','becos_v4','becos_v5','becos_v6','becos_v7'];
  for(const key of keys){
    try{
      const raw=localStorage.getItem(key);
      if(!raw)continue;
      const x=JSON.parse(raw);
      const data={
        clientes:Array.isArray(x.clientes)?x.clientes:[],
        vehiculos:Array.isArray(x.vehiculos)?x.vehiculos:[],
        servicios:Array.isArray(x.servicios)?x.servicios:[],
        productos:Array.isArray(x.productos)?x.productos:[]
      };
      const total=data.clientes.length+data.vehiculos.length+data.servicios.length+data.productos.length;
      if(total) candidates.push({key,data,total});
    }catch{}
  }
  return candidates;
}
function showRecovery(){
  const found=findOlderCopies();
  if(!found.length){
    return alert('No se encontró una copia anterior completa en este navegador.\\n\\nNo se modificó ningún dato.');
  }
  const txt=found.map(x=>`${x.key}: ${x.data.clientes.length} clientes · ${x.data.vehiculos.length} vehículos · ${x.data.servicios.length} servicios · ${x.data.productos.length} productos`).join('\\n');
  alert('🔎 Copias locales encontradas:\\n\\n'+txt+'\\n\\nLa recuperación todavía no modifica nada. Si alguna contiene tus datos anteriores, podemos restaurarla con confirmación.');
}
async function restoreOldCopy(key){
  const raw=localStorage.getItem(key);
  if(!raw)return alert('No se encontró esa copia.');
  try{
    const x=JSON.parse(raw);
    const data={
      clientes:Array.isArray(x.clientes)?x.clientes:[],
      vehiculos:Array.isArray(x.vehiculos)?x.vehiculos:[],
      servicios:Array.isArray(x.servicios)?x.servicios:[],
      productos:Array.isArray(x.productos)?x.productos:[]
    };
    if(!confirm(`Recuperar ${data.clientes.length} clientes, ${data.vehiculos.length} vehículos, ${data.servicios.length} servicios y ${data.productos.length} productos desde ${key}?\\n\\nSe hará un respaldo de V8 antes de restaurar.`))return;
    await backupLocal('antes-de-restaurar-'+key);

}

    alert('❌ No se pudo guardar el producto en Supabase.\\n\\n'+(e.status?`HTTP ${e.status}: `:'')+e.message+'\\n\\nUsá ⚙️ Configurar → 🧪 Diagnóstico.');
    return;
  }
  D.productos.push(p);save();close();products();
}
function settings(){
  const backup=localStorage.getItem(K+'_backup');
  let info='No hay respaldo local disponible.';
  if(backup){
    try{
      const b=JSON.parse(backup);
      const d=b.data||{};
      info=`Último respaldo: ${b.createdAt?new Date(b.createdAt).toLocaleString('es-AR'):'desconocido'} · Clientes ${d.clientes?.length||0} · Vehículos ${d.vehiculos?.length||0} · Servicios ${d.servicios?.length||0} · Productos ${d.productos?.length||0}`;
    }catch{}
  }
  open(`<h3>⚙️ Configuración, recuperación y sincronización</h3>
  <div class="notice"><b>🛡️ Datos protegidos</b><br><span class="muted small">La aplicación es local-first. Conectar Supabase NO reemplaza tus datos. Cada sincronización crea un respaldo y nunca borra datos remotos automáticamente.</span></div>
  <h4>☁️ Conexión Supabase</h4>
  <div class="field">Project URL<input id="a" value="${E(D.settings.url||'https://evrwqprgndkpsqznyuph.supabase.co')}"></div>
  <div class="field">Publishable key<input id="b" value="${E(D.settings.key||'')}" placeholder="sb_publishable_..."></div>
  <div class="field">Correo del usuario Supabase<input id="c" value="${E(D.settings.email||'')}" type="email"></div>
  <div class="field">Contraseña<input id="d" type="password" placeholder="Contraseña de tu usuario Supabase"></div>
  <div class="actions"><button onclick="connect()">🔐 Conectar</button><button onclick="testConnection()">🔎 Probar</button><button onclick="diagnose()">🧪 Diagnóstico</button></div>
  <hr style="border:0;border-top:1px solid #263247;margin:18px 0">
  <h4>💾 Respaldo y recuperación</h4>
  <p class="muted small">${E(info)}</p>
  <div class="actions">
    <button class="blue" onclick="backupLocal();alert('✅ Respaldo creado con los datos actuales.')">💾 Crear respaldo</button>
    <button class="secondary" onclick="downloadBackup()">⬇️ Exportar respaldo</button>
    <button class="secondary" onclick="document.getElementById('restoreFile').click()">📥 Recuperar respaldo</button>
    <input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(this.files[0])">
  </div>
  <hr style="border:0;border-top:1px solid #263247;margin:18px 0">
  <h4>☁️ Sincronización</h4>
  <p class="muted small">Primero hace una copia de seguridad. Después consulta Supabase y recupera los registros sin borrar nada del proyecto remoto.</p>
  <div class="actions">
    <button onclick="settings()">⚙️ Cambiar / configurar Supabase</button>${cfg()?'<button class="success" onclick="previewSupabase()">🛡️ Ver y recuperar datos de Supabase</button>':'<span class="muted small">Después de guardar una clave válida aparecerá la recuperación.</span>'}${cfg()?'<button class="blue" onclick="safeSynchronize()">☁️ Sincronizar ahora</button>':''}
  </div>
  <div class="actions" style="margin-top:16px"><button class="secondary" onclick="close()">Cerrar</button></div>`);
}

async function restoreBackup(file){
  if(!file)return;
  try{
    const text=await file.text();
    const b=JSON.parse(text);
    const d=b.data||b;
    if(!Array.isArray(d.clientes)||!Array.isArray(d.vehiculos)||!Array.isArray(d.servicios)||!Array.isArray(d.productos)){
      throw new Error("El archivo no tiene un respaldo BECO'S válido.");
    }
    if(!confirm(`Se encontraron ${d.clientes.length} clientes, ${d.vehiculos.length} vehículos, ${d.servicios.length} servicios y ${d.productos.length} productos.\\n\\nEsto reemplazará SOLO los datos locales actuales. ¿Continuar?`))return;
    await backupLocal('antes-de-restaurar');
    D.clientes=d.clientes;D.vehiculos=d.vehiculos;D.servicios=d.servicios;D.productos=d.productos;
    save();close();home();
    alert('✅ Respaldo restaurado correctamente.');
  }catch(e){alert('❌ No se pudo recuperar el respaldo: '+e.message)}
}

async function connect(){
  const newUrl=a.value.trim(), newKey=b.value.trim(), email=c.value.trim(), password=d.value;
  if(!newUrl||!newKey)return alert('❌ Completá Project URL y Publishable key.');
  D.settings.url=cleanUrl(newUrl);D.settings.key=newKey;D.settings.email=email;
  D.settings.access_token='';D.settings.refresh_token='';
  save();
  try{
    // First try the publishable key directly. This is the safest path when
    // the project's RLS policies allow access without a user JWT.
    await testConnection(true);
    await backupLocal('después-de-conectar');
    close();home();
    alert('✅ Supabase responde correctamente.\n\nLa aplicación quedó conectada con la Publishable key.\nTus datos locales NO fueron reemplazados.\n\nAhora podemos ver y combinar los datos de Supabase de forma segura.');
    return;
  }catch(e){
    // If the project requires an authenticated user, optionally try the
    // email/password flow only when the user supplied credentials.
    if(email && password){
      try{
        await login(email,password);
        await testConnection(true);
        await backupLocal('después-de-conectar');
        close();home();
        alert('✅ Supabase conectado con autenticación.\n\nTus datos locales NO fueron reemplazados.\nLa sincronización queda a tu decisión.');
        return;
      }catch(authErr){
        alert('❌ Supabase está activo, pero esta aplicación necesita permisos de acceso a las tablas.\n\nPrueba directa: '+(e.status?`HTTP ${e.status}: `:'')+e.message+'\n\nAutenticación: '+(authErr.status?`HTTP ${authErr.status}: `:'')+authErr.message+'\n\nNo se modificó ningún dato.');
        return;
      }
    }
    alert('❌ Supabase responde, pero no permite consultar la tabla "clientes" con esta Publishable key.\n\nNo se modificó ningún dato.\n\nSi las tablas tienen RLS, necesitaremos usar el acceso autenticado del proyecto o ajustar las políticas desde Supabase.');
  }
}

try{home()}catch(e){console.error(e);mainEl.innerHTML='<div class="card"><h3>⚠️ Error al cargar BECO\'S</h3><p class="muted">La aplicación se abrió, pero hay datos antiguos incompatibles. Tocá Configurar o limpiá los datos del sitio y volvé a abrir.</p><button onclick="settings()">⚙️ Configurar</button></div>'}
if(!D.settings.lastBackup && !localStorage.getItem(K+'_backup')) backupLocal('primer-inicio');
